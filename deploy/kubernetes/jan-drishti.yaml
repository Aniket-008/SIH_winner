# =============================================================================
#  JAN-DRISHTI AI - Kubernetes deployment (StatefulSet + HPA + probes)
#
#  Why a StatefulSet rather than a Deployment: the fleet view needs every
#  replica to know its peers by a stable DNS name. StatefulSet pods get
#  predictable names (jan-drishti-0, -1, -2 ...) behind a headless Service, so
#  JAN_DRISHTI_CLUSTER_NODES can be a fixed list instead of a lookup dance.
#
#  Apply:
#     kubectl apply -f deploy/kubernetes/jan-drishti.yaml
#     kubectl -n jan-drishti port-forward svc/jan-drishti 8080:80
#     open http://localhost:8080  ->  Scalability section  ->  fleet of 3 replicas
#
#  IMPORTANT: replace the secret values before using this outside a demo.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: jan-drishti
---
apiVersion: v1
kind: Secret
metadata:
  name: jan-drishti-secrets
  namespace: jan-drishti
type: Opaque
stringData:
  # Shared signing key: a session created on replica A must be accepted by
  # replica B, otherwise the balancer would need sticky sessions.
  # Generate with:  python -c "import secrets;print(secrets.token_hex(32))"
  JAN_DRISHTI_SECRET_KEY: "REPLACE-WITH-32-BYTE-RANDOM-HEX"
  # Shared secret for the cluster-token-protected /api/cluster/* control plane.
  JAN_DRISHTI_CLUSTER_TOKEN: "REPLACE-WITH-RANDOM-CLUSTER-TOKEN"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jan-drishti-config
  namespace: jan-drishti
data:
  JAN_DRISHTI_ENV: "kubernetes"
  JAN_DRISHTI_PROXY_LAYER: "nginx"
  # Traffic-control defaults (all of these are live-tunable from the dashboard)
  JAN_DRISHTI_RATE_LIMIT_RPS: "25"
  JAN_DRISHTI_RATE_LIMIT_BURST: "60"
  JAN_DRISHTI_MAX_CONCURRENT: "64"
  JAN_DRISHTI_TARGET_P95_MS: "250"
  JAN_DRISHTI_RPS_PER_NODE: "40"
  JAN_DRISHTI_MAX_UPLOAD_MB: "50"
  # Peer list for the fleet view (stable StatefulSet pod DNS names).
  JAN_DRISHTI_CLUSTER_NODES: "http://jan-drishti-0.jan-drishti-headless:8000,http://jan-drishti-1.jan-drishti-headless:8000,http://jan-drishti-2.jan-drishti-headless:8000,http://jan-drishti-3.jan-drishti-headless:8000"
---
# Headless service: per-pod DNS for the cluster view
apiVersion: v1
kind: Service
metadata:
  name: jan-drishti-headless
  namespace: jan-drishti
spec:
  clusterIP: None
  selector:
    app: jan-drishti
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Service used by the ingress / load balancer
apiVersion: v1
kind: Service
metadata:
  name: jan-drishti
  namespace: jan-drishti
  labels:
    app: jan-drishti
spec:
  type: ClusterIP
  selector:
    app: jan-drishti
  ports:
    - name: http
      port: 80
      targetPort: http
  sessionAffinity: None     # no sticky sessions needed: signed tokens are stateless
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jan-drishti
  namespace: jan-drishti
spec:
  serviceName: jan-drishti-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: jan-drishti
  template:
    metadata:
      labels:
        app: jan-drishti
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /api/metrics
        prometheus.io/port: "8000"
    spec:
      terminationGracePeriodSeconds: 30   # let in-flight analyses finish
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: jan-drishti:1.1-scalable        # build: docker build -f deploy/Dockerfile -t jan-drishti:1.1-scalable .
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: jan-drishti-config
          env:
            - name: JAN_DRISHTI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jan-drishti-secrets
                  key: JAN_DRISHTI_SECRET_KEY
            - name: JAN_DRISHTI_CLUSTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jan-drishti-secrets
                  key: JAN_DRISHTI_CLUSTER_TOKEN
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # $(HOSTNAME) expands to the pod name -> this replica's own URL, so
            # it recognises itself in the peer list and never double counts.
            - name: JAN_DRISHTI_INSTANCE_ID
              value: "$(HOSTNAME)"
            - name: JAN_DRISHTI_PUBLIC_URL
              value: "http://$(HOSTNAME).jan-drishti-headless:8000"
          # Readiness decides whether the balancer sends traffic here. The probe
          # returns 503 when the replica is saturated or erroring, so a struggling
          # pod is taken out of rotation instead of timing every request out.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 15
          resources:
            requests:
              cpu: 250m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}        # swap for a PVC if analysis history must survive restarts
---
# PodDisruptionBudget: keep the dashboard answerable during node drains
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jan-drishti-pdb
  namespace: jan-drishti
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: jan-drishti
---
# =============================================================================
#  Horizontal Pod Autoscaler
#  CPU-based by default (works on any cluster with metrics-server).
#  The app also publishes purpose-built scaling signals at /api/metrics:
#     jan_drishti_cluster_requests_per_sec
#     jan_drishti_cluster_p95_ms
#     jan_drishti_autoscale_desired_nodes
#  To scale on the app's own numbers instead of CPU, install
#  prometheus-adapter and uncomment the Pods metric below - it is the same
#  measurement the in-app autoscaler recommendation is built from.
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jan-drishti-hpa
  namespace: jan-drishti
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: jan-drishti
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0        # overload: react immediately
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300      # shrink slowly, avoid flapping
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    # - type: Pods
    #   pods:
    #     metric:
    #       name: jan_drishti_cluster_requests_per_sec
    #     target:
    #       type: AverageValue
    #       averageValue: "40"
---
# =============================================================================
#  Optional ingress (nginx ingress controller). The controller / cloud LB is
#  the "layer 1-2" edge tier here; the app keeps its own token bucket as the
#  last line of defence.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jan-drishti
  namespace: jan-drishti
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/limit-rps: "25"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "40"
    # Deliberately NOT setting cookie affinity / upstream-hash-by: sessions are
    # signed tokens valid on every replica, so plain round-robin gives the most
    # even spread (watch the traffic-share bars in the dashboard).
spec:
  ingressClassName: nginx
  rules:
    - host: jan-drishti.example.gov.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jan-drishti
                port:
                  name: http
