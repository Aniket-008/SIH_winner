# =============================================================================
#  JAN-DRISHTI AI - horizontally scaled demo stack
#  4 app replicas + Nginx load balancer, and a Prometheus/Grafana pair so the
#  counters on the dashboard can also be viewed as time series.
#
#  Run:
#     docker compose -f deploy/docker-compose.scale.yml up --build
#     open http://localhost:8080          -> the application
#     open the "Scalability" section      -> fleet view across all 4 replicas
#     open http://localhost:9090          -> Prometheus (targets: app replicas)
#
#  Scale to 6 replicas (Nginx config lists the 4 compose services; add more
#  entries to deploy/nginx/jan_drishti.docker.conf or use the upstream pool
#  with `server app1:8000` style DNS round-robin):
#     docker compose -f deploy/docker-compose.scale.yml up -d --scale app1=1
#
#  Every replica shares one signing key and one cluster token, so sessions are
#  valid on any replica (no sticky sessions) and the fleet view can read every
#  node's telemetry.
# =============================================================================
name: jan-drishti-scale

x-app-env: &app-env
  JAN_DRISHTI_HOST: "0.0.0.0"
  JAN_DRISHTI_PORT: "8000"
  JAN_DRISHTI_ENV: "docker-scale"
  JAN_DRISHTI_PROXY_LAYER: "nginx"
  # Shared across replicas: set a real secret (32+ random bytes) in production.
  JAN_DRISHTI_SECRET_KEY: "change-me-shared-signing-key-please-32bytes"
  JAN_DRISHTI_CLUSTER_TOKEN: "jandrishti-cluster-demo"
  JAN_DRISHTI_CLUSTER_NODES: "http://app1:8000,http://app2:8000,http://app3:8000,http://app4:8000"
  JAN_DRISHTI_RATE_LIMIT_RPS: "25"
  JAN_DRISHTI_MAX_CONCURRENT: "64"
  JAN_DRISHTI_TARGET_P95_MS: "250"
  JAN_DRISHTI_RPS_PER_NODE: "40"

services:
  app1:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      <<: *app-env
      JAN_DRISHTI_INSTANCE_ID: "node-1"
      JAN_DRISHTI_PUBLIC_URL: "http://app1:8000"
    restart: unless-stopped
  app2:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      <<: *app-env
      JAN_DRISHTI_INSTANCE_ID: "node-2"
      JAN_DRISHTI_PUBLIC_URL: "http://app2:8000"
    restart: unless-stopped
  app3:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      <<: *app-env
      JAN_DRISHTI_INSTANCE_ID: "node-3"
      JAN_DRISHTI_PUBLIC_URL: "http://app3:8000"
    restart: unless-stopped
  app4:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      <<: *app-env
      JAN_DRISHTI_INSTANCE_ID: "node-4"
      JAN_DRISHTI_PUBLIC_URL: "http://app4:8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on: [app1, app2, app3, app4]
    ports:
      - "8080:80"
    volumes:
      - ./nginx/jan_drishti.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "jandrishti"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  nginx_cache:
