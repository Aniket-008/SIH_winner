# =============================================================================
#  JAN-DRISHTI AI - Nginx edge tier (reverse proxy + load balancer + WAF-ish)
# =============================================================================
#  This is the "front door" for the scalable deployment:
#
#     officer browser
#          |  HTTPS
#          v
#     [ nginx :443 ]  -- TLS, gzip, rate limit, connection limit, static cache
#          |  http/1.1 keepalive
#          +--> app replica 1  (127.0.0.1:8001)
#          +--> app replica 2  (127.0.0.1:8002)   <- add/remove servers, no code change
#          +--> app replica 3  (127.0.0.1:8003)
#          +--> app replica 4  (127.0.0.1:8004)
#
#  Start the replicas first (any of):
#     python scripts/start_cluster.py --nodes 4 --base-port 8001
#     docker compose -f deploy/docker-compose.scale.yml up --scale ...
#
#  Every replica must share the same signing key so a session created on one
#  replica is accepted by the others (no sticky sessions required):
#     export JAN_DRISHTI_SECRET_KEY="<32+ random bytes from your secret manager>"
#
#  The dashboard reads the edge tier from this variable so the UI can show the
#  real request path:
#     export JAN_DRISHTI_PROXY_LAYER=nginx
#
#  Install:
#     sudo cp deploy/nginx/jan_drishti.conf /etc/nginx/conf.d/jan_drishti.conf
#     sudo mkdir -p /var/cache/nginx/jan_drishti
#     sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ----------------------------- upstream pool --------------------------------
upstream jan_drishti_backend {
    # least_conn is the right default here: the analysis pipeline is CPU bound,
    # so the balancer should favour whichever replica is least busy rather than
    # blindly round-robining into a replica that is mid-analysis.
    least_conn;

    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8003 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8004 max_fails=3 fail_timeout=10s;

    # Reuse upstream TCP connections. Without this every browser request opens a
    # new connection to the app and the accept queue becomes the bottleneck long
    # before the CPU does.
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# ------------------------- traffic control zones ----------------------------
# Layer 1 of rate limiting (the app repeats it in-process so a bypassed proxy
# cannot take the model engine down).
limit_req_zone $binary_remote_addr zone=jan_api:10m rate=25r/s;      # normal API traffic
limit_req_zone $binary_remote_addr zone=jan_login:10m rate=5r/s;     # credential stuffing guard
limit_req_zone $binary_remote_addr zone=jan_bulk:10m rate=1r/s;      # analysis uploads
limit_conn_zone $binary_remote_addr zone=jan_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Static asset cache shared by all officers hitting the same dashboard.
proxy_cache_path /var/cache/nginx/jan_drishti levels=1:2 keys_zone=jan_static:20m
                 max_size=1g inactive=60m use_temp_path=off;

# ------------------------------ status page ---------------------------------
server {
    listen 127.0.0.1:8081;
    server_name _;
    location = /nginx_status {
        stub_status;                 # nginx -s ... | curl 127.0.0.1:8081/nginx_status
        allow 127.0.0.1;
        deny all;
    }
    location = /health { return 200 "nginx ok\n"; }
}

# ------------------------------- main site ----------------------------------
server {
    listen 80;
    server_name jan-drishti.local;

    # ---- performance basics -------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 512;
    client_max_body_size 50m;          # matches JAN_DRISHTI_MAX_UPLOAD_MB
    client_body_timeout 60s;
    keepalive_timeout 65s;
    server_tokens off;

    # ---- security headers ---------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- edge rate limits ---------------------------------------------------
    limit_conn jan_conn 40;            # concurrent connections per client IP
    limit_req zone=jan_api burst=60 nodelay;

    # ---- shared proxy settings ---------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";    # required for upstream keepalive

    proxy_connect_timeout 2s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;           # uploads of large CSV extracts
    proxy_buffering on;

    # Failover: if a replica dies or is saturated, retry on the next upstream.
    # The app is stateless (signed tokens), so retrying a GET/POST is safe.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 10s;

    # ---- health probe for external monitors --------------------------------
    location = /health {
        access_log off;
        add_header X-Upstream $upstream_addr always;
        proxy_pass http://jan_drishti_backend;
    }

    # ---- credential endpoint: strict limit ----------------------------------
    location = /api/login {
        limit_req zone=jan_login burst=10 nodelay;
        access_log off;
        proxy_pass http://jan_drishti_backend;
    }

    # ---- bulk analysis uploads: low rate, big bodies, long timeout ----------
    location = /api/analyze {
        limit_req zone=jan_bulk burst=5 nodelay;
        client_max_body_size 50m;
        proxy_request_buffering on;
        proxy_read_timeout 300s;
        proxy_pass http://jan_drishti_backend;
    }

    # ---- Prometheus scrape (keep this admin-only / private network) ---------
    location = /metrics {
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://jan_drishti_backend;
    }

    # ---- static assets: cached at the edge ---------------------------------
    location ~* \.(css|js|svg|png|ico|woff2)$ {
        proxy_cache jan_static;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;                       # collapse the stampede on deploy
        add_header X-Proxy-Cache $upstream_cache_status always;
        expires 5m;
        proxy_pass http://jan_drishti_backend;
    }

    # ---- everything else ----------------------------------------------------
    location / {
        proxy_pass http://jan_drishti_backend;
        add_header X-Served-By $upstream_addr always;
    }
}

# =============================================================================
#  Scale-out / scale-in on this box (no orchestrator needed)
# =============================================================================
#  Add a replica:
#     python -m jan_drishti.server --port 8005 &         # new process
#     # then add "server 127.0.0.1:8005;" to the upstream block and:
#     sudo nginx -t && sudo systemctl reload nginx        # zero-downtime reload
#
#  Remove a replica with zero dropped requests:
#     mark it "down" in the upstream, reload, wait for in-flight to drain,
#     then stop the process. Watch /api/scalability to confirm 0 in-flight.
#
#  Automatic scaling: drive the same decision the dashboard recommends -
#  scale out when p95 > JAN_DRISHTI_TARGET_P95_MS or req/s per node >
#  JAN_DRISHTI_RPS_PER_NODE (see deploy/kubernetes/jan-drishti.yaml HPA).
# =============================================================================
