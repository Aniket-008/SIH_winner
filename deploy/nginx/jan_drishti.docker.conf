# =============================================================================
#  JAN-DRISHTI AI - Nginx config for the docker-compose scale-out stack
#  Used by deploy/docker-compose.scale.yml (service: nginx)
#  Upstream hostnames are Docker service names resolved on the compose network.
# =============================================================================

upstream jan_drishti_backend {
    least_conn;
    server app1:8000 max_fails=3 fail_timeout=10s;
    server app2:8000 max_fails=3 fail_timeout=10s;
    server app3:8000 max_fails=3 fail_timeout=10s;
    server app4:8000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

limit_req_zone $binary_remote_addr zone=jan_api:10m rate=25r/s;
limit_req_zone $binary_remote_addr zone=jan_bulk:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=jan_conn:10m;
limit_req_status 429;
limit_conn_status 429;

proxy_cache_path /var/cache/nginx/jan_static levels=1:2 keys_zone=jan_static:10m
                 max_size=256m inactive=30m use_temp_path=off;

server {
    listen 80;
    server_name _;
    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;
    client_max_body_size 50m;
    server_tokens off;

    limit_conn jan_conn 40;
    limit_req zone=jan_api burst=60 nodelay;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_next_upstream error timeout http_502 http_503 http_504;

    location = /health {
        access_log off;
        proxy_pass http://jan_drishti_backend;
    }

    location = /api/analyze {
        limit_req zone=jan_bulk burst=5 nodelay;
        proxy_read_timeout 300s;
        proxy_pass http://jan_drishti_backend;
    }

    location = /api/scalability {
        # The dashboard polls this every 3s; it must never be throttled for
        # officers watching an incident.
        limit_req zone=jan_api burst=200 nodelay;
        proxy_pass http://jan_drishti_backend;
    }

    location ~* \.(css|js|svg|png|ico|woff2)$ {
        proxy_cache jan_static;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Proxy-Cache $upstream_cache_status always;
        expires 5m;
        proxy_pass http://jan_drishti_backend;
    }

    location / {
        proxy_pass http://jan_drishti_backend;
        add_header X-Served-By $upstream_addr always;
    }
}
