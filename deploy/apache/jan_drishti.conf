# =============================================================================
#  JAN-DRISHTI AI - Apache httpd edge tier (reverse proxy + balancer + caching)
# =============================================================================
#  Equivalent of the Nginx config, for departments standardised on httpd.
#
#     officer browser
#          |  HTTPS
#          v
#     [ httpd :443 ]  -- mod_ssl, mod_deflate, mod_ratelimit, mod_cache
#          |  http/1.1 keepalive
#          +--> balancer://jandrishti  => 127.0.0.1:8001..8004 (mod_proxy_balancer)
#
#  Required modules (RHEL: /etc/httpd/conf.modules.d, Debian: a2enmod):
#     proxy proxy_http proxy_balancer lbmethod_bybusyness lbmethod_byrequests
#     headers deflate cache cache_disk rewrite remoteip status
#     # optional but recommended:
#     qos                 (mod_qos, EL only - per-request/per-IP rate limiting)
#     ratelimit           (mod_ratelimit - bandwidth limiting per connection)
#     security            (mod_security2 - WAF)
#
#  Shared signing key across replicas (no sticky sessions needed):
#     SetEnv JAN_DRISHTI_SECRET_KEY "<32+ random bytes from your secret manager>"
#
#  Install:
#     sudo cp deploy/apache/jan_drishti.conf /etc/httpd/conf.d/jan_drishti.conf
#     sudo mkdir -p /var/cache/httpd/jan_drishti && sudo chown apache:apache /var/cache/httpd/jan_drishti
#     sudo apachectl configtest && sudo systemctl reload httpd
# =============================================================================

# ----------------------------- upstream cluster -----------------------------
<Proxy balancer://jandrishti>
    BalancerMember http://127.0.0.1:8001 route=node1 connectiontimeout=2 retry=10
    BalancerMember http://127.0.0.1:8002 route=node2 connectiontimeout=2 retry=10
    BalancerMember http://127.0.0.1:8003 route=node3 connectiontimeout=2 retry=10
    BalancerMember http://127.0.0.1:8004 route=node4 connectiontimeout=2 retry=10
    # bybusyness = send work to the replica with the fewest requests in flight,
    # which matches the CPU-bound analysis pipeline better than round-robin.
    ProxySet lbmethod=bybusyness
    ProxySet failonstatus=500,502,503,504
    ProxySet timeout=120
    # NOTE: deliberately NO stickysession. Sessions are HMAC-signed tokens and a
    # session created by one replica is valid on every replica, so the balancer
    # is free to spread requests evenly (or fail a request over mid-analysis).
    # Requirement: identical JAN_DRISHTI_SECRET_KEY on every replica.
</Proxy>

# ------------------------------- tuning -------------------------------------
ProxyPreserveHost On
ProxyTimeout 120
KeepAlive On
MaxKeepAliveRequests 1000
KeepAliveTimeout 5
ServerTokens Prod
ServerSignature Off

# ----------------------- traffic control (rate limits) ----------------------
# Layer A - mod_qos (EL/CentOS/RHEL). Two knobs per client IP:
#   QS_ClientMaxReqPerSec: sustained requests/second from one IP
#   QS_SrvMaxConnPerIP  : concurrent connections from one IP
<IfModule mod_qos.c>
    QS_ClientMaxReqPerSec 25 60
    QS_SrvMaxConnPerIP 40
    QS_SrvMaxConn 800
    QS_ClientSerialize off
</IfModule>

# Layer B - mod_ratelimit (available everywhere): cap bulk download bandwidth
# so a large CSV/JSON export cannot starve interactive dashboard users.
<IfModule mod_ratelimit.c>
    <Location "/api/analyze">
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 512
    </Location>
</IfModule>

# Layer C - the application repeats the limit in-process (HTTP 429 + Retry-After),
# so a bypassed or misconfigured proxy still cannot take the model engine down.

# ------------------------------- response cache -----------------------------
<IfModule mod_cache_disk.c>
    CacheEnable disk "/"
    CacheRoot /var/cache/httpd/jan_drishti
    CacheDirLevels 2
    CacheDirLength 1
    CacheMaxFileSize 2000000
    CacheDefaultExpire 300
    CacheIgnoreCacheControl On
</IfModule>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css application/json application/javascript image/svg+xml
    DeflateCompressionLevel 6
</IfModule>

<IfModule mod_remoteip.c>
    # Real client IP reaches the app through these headers -> per-IP rate limits
    # and the audit log record the officer, not the proxy.
    RemoteIPHeader X-Forwarded-For
</IfModule>

# --------------------------- balancer manager UI ----------------------------
# Enable/disable replicas live from http://127.0.0.1/balancer-manager
<Location "/balancer-manager">
    SetHandler balancer-manager
    Require ip 127.0.0.1
</Location>

<Location "/server-status">
    SetHandler server-status
    Require ip 127.0.0.1
</Location>

# =============================================================================
#  Virtual host
# =============================================================================
<VirtualHost *:80>
    ServerName jan-drishti.local
    DocumentRoot "/var/www/html"

    # ---- security headers ---------------------------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # ---- request limits -----------------------------------------------------
    LimitRequestBody 52428800            # 50 MB, matches JAN_DRISHTI_MAX_UPLOAD_MB
    LimitRequestFields 100
    Timeout 120

    # ---- health probe (used by external monitors and the load balancer) -----
    ProxyPass "/health" "balancer://jandrishti/health" connectiontimeout=2 timeout=5
    ProxyPassReverse "/health" "balancer://jandrishti/health"

    # ---- credential endpoint: tighten the rate limit further ----------------
    <Location "/api/login">
        <IfModule mod_qos.c>
            SetEnv QS_ClientMaxReqPerSec 5
        </IfModule>
        # mod_security2 hardening (if enabled)
        <IfModule security2_module>
            SecRuleEngine On
            SecRule REQUEST_URI "@streq /api/login" "id:9010,phase:1,pass,nolog,setenv:jan_login,=,1"
        </IfModule>
    </Location>

    # ---- static assets ------------------------------------------------------
    <LocationMatch "\.(css|js|svg|png|ico|woff2)$">
        Header set Cache-Control "public, max-age=300"
        ExpiresActive On
        ExpiresDefault "access plus 5 minutes"
    </LocationMatch>

    # ---- everything else goes to the cluster --------------------------------
    ProxyPass "/" "balancer://jandrishti/" connectiontimeout=2 timeout=120
    ProxyPassReverse "/" "balancer://jandrishti/"

    # ---- Prometheus scrape: private networks only ---------------------------
    <Location "/metrics">
        Require ip 10.0.0.0/8
        Require ip 127.0.0.1
    </Location>

    ErrorLog  /var/log/httpd/jan_drishti_error.log
    CustomLog /var/log/httpd/jan_drishti_access.log combined
</VirtualHost>

# =============================================================================
#  Scaling notes
# =============================================================================
#  * Add capacity: start another replica
#        python -m jan_drishti.server --port 8005 &
#    then add "BalancerMember http://127.0.0.1:8005" to the <Proxy> block and
#    "sudo apachectl graceful" (graceful = new workers pick up the config, old
#    requests finish untouched).
#  * Drain a replica: in /balancer-manager set it to "drained"; the balancer
#    stops sending new requests while in-flight analysis finishes. Confirm 0
#    in-flight on the dashboard, then stop the process.
#  * Health checks: mod_proxy does not probe by default - either rely on
#    failonstatus/retry, or add mod_proxy_hcheck:
#        ProxyHCExpr ok234 {%{REQUEST_STATUS} =~ /^[234]/}
#        <Proxy balancer://jandrishti>
#            BalancerMember http://127.0.0.1:8001 hcmethod=GET hcuri=/health hcexpr=ok234
#        </Proxy>
#  * Autoscaling: same signal the dashboard recommends (p95 latency and req/s
#    per replica -> scale the VM/container pool).
# =============================================================================
