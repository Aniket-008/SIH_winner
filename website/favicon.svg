<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JAN-DRISHTI AI">
  <!-- JAN-DRISHTI AI tab / app icon: ascending analytics bars under a warning
       arc - "rising data, early warning". Designed to stay legible at 16px. -->
  <defs>
    <linearGradient id="jdTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2154d4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="jdBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#jdTile)"/>

  <!-- early-warning arc -->
  <path d="M16 20a22 22 0 0 1 32 0" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.95"/>

  <!-- analytics bars -->
  <rect x="14" y="36" width="9" height="14" rx="3" fill="url(#jdBar)"/>
  <rect x="27.5" y="28" width="9" height="22" rx="3" fill="url(#jdBar)"/>
  <rect x="41" y="20" width="9" height="30" rx="3" fill="url(#jdBar)"/>
</svg>
